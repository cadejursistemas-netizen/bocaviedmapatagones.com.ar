version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: pboca_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_DATABASE: wordpress_boca
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_red

  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    container_name: pboca_wp
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
      WORDPRESS_DB_NAME: wordpress_boca
    volumes:
      - ./wp-content:/var/www/html/wp-content:delegated
    networks:
      - wp_red

  phpmyadmin:
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    container_name: pboca_pma
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: root_password_segura
    networks:
      - wp_red

volumes:
  db_data:
  wp_data:

networks:
  wp_red:
    driver: bridge